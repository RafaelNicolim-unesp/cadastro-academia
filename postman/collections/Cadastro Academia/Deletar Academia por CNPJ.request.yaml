$kind: http-request
method: DELETE
url: '{{baseUrl}}/academia/cnpj/{{cnpjDeletar}}'
order: 4000
pathVariables:
  - key: cnpjDeletar
    value: 12.345.678/0001-99
    description: CNPJ da academia a ser deletada
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 204 No Content", function () {
          pm.response.to.have.status(204);
      });
