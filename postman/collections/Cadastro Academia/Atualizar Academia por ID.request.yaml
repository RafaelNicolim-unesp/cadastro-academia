$kind: http-request
method: PUT
url: '{{baseUrl}}/academia/{{academiaId}}'
order: 3000
pathVariables:
  - key: academiaId
    value: '1'
    description: ID da academia a ser atualizada
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Academia Força Total Atualizada",
      "cnpj": "12.345.678/0001-99",
      "endereco": "Av. Paulista, 500 - São Paulo, SP",
      "mensalidade": 119.90,
      "capacidadeAlunos": 250
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
          pm.response.to.have.status(200);
      });
