$kind: http-request
method: GET
url: '{{baseUrl}}/academia/nome/{{nomeBusca}}'
order: 2000
pathVariables:
  - key: nomeBusca
    value: Academia Força Total
    description: Nome da academia a ser buscada
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Resposta contém campos esperados", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData).to.have.property("nome");
          pm.expect(jsonData).to.have.property("cnpj");
          pm.expect(jsonData).to.have.property("endereco");
          pm.expect(jsonData).to.have.property("mensalidade");
          pm.expect(jsonData).to.have.property("capacidadeAlunos");
      });

      pm.test("Nome corresponde ao buscado", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.nome).to.eql(pm.variables.get("nomeBusca"));
      });
